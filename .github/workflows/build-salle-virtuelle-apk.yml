name: Build Salle Virtuelle APK
on:
  push:
    branches: [salle-virtuelle-apk-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK setup
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: salle-virtuelle-transmissions-android
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp salle-virtuelle-transmissions-android/app/build/outputs/apk/debug/app-debug.apk Salle-Virtuelle-Transmissions.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Salle-Virtuelle-Transmissions-APK
          path: Salle-Virtuelle-Transmissions.apk
          if-no-files-found: error
